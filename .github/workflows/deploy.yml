name: CI/CD Pipeline & GitHub Pages Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Codebase & Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit Repository Files
        run: |
          echo "Auditing core files..."
          test -f index.html || (echo "ERROR: index.html missing" && exit 1)
          test -f config.example.js || (echo "ERROR: config.example.js missing" && exit 1)
          test -f js/app.js || (echo "ERROR: js/app.js missing" && exit 1)
          test -f js/crypto.js || (echo "ERROR: js/crypto.js missing" && exit 1)
          test -f js/auth.js || (echo "ERROR: js/auth.js missing" && exit 1)
          test -f js/vault.js || (echo "ERROR: js/vault.js missing" && exit 1)
          echo "✅ All required codebase files verified successfully."

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Verify Pages Availability
        if: steps.pages_setup.outcome == 'failure'
        run: |
          echo "::notice::GitHub Pages is not enabled yet on this repository."
          echo "To enable deployment, sign in to GitHub and visit: https://github.com/${{ github.repository }}/settings/pages"
          echo "Select Source -> GitHub Actions."

      - name: Upload Pages Artifact
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.pages_setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
